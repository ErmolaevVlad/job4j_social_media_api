post:
  tags:
    - Offer-friendship
  operationId: rejectOfferFriendships
  summary: Отклонить заявку в друзья
  requestBody:
    required: true
    content:
      application/json:
        schema:
          title: rejectOfferFriendshipsRequest
          type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
              format: uuid
              example: "99999999-9999-9999-99999-999999999999"
  responses:
    '200':
      description: Заявка в друзья отклонена
      content:
        application/json:
          schema:
            title: rejectOfferFriendshipsResponse
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
            properties:
              id:
                type: string
                format: uuid
                example: "99999999-9999-9999-99999-999999999999"
              fromUserId:
                type: string
                format: uuid
                example: "1111111-1111-1111-1111-111111111111"
              toUserId:
                type: string
                format: uuid
                example: "22222222-2222-2222-2222-222222222222"
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: REJECTED
    '204':
      description: Заявка уже была обработана ранее
    '403':
      description: Нет прав на обработку заявки
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Недостаточно прав
              status:
                type: integer
                example: 403
              detail:
                type: string
                example: Пользователь не имеет права обработать заявку
              code:
                type: string
                example: ACCESS_DENIED
    '404':
      description: Заявка не найдена
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Заявка не найдена
              status:
                type: integer
                example: 404
              detail:
                type: string
                example: Заявка в друзья с указанным ID не существует
              code:
                type: string
                example: FRIEND_REQUEST_NOT_FOUND
    '409':
      description: Заявка в друзья уже была принята
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Невозможно отклонить заявку
              status:
                type: integer
                example: 409
              detail:
                type: string
                example: Заявка в друзья уже была принята ранее
              code:
                type: string
                example: FRIEND_REQUEST_ALREADY_ACCEPTED