post:
  summary: Отправить заявку в друзья
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: integer
              format: int64
              example: 10
            toUserId:
              type: integer
              format: int64
              example: 42
  responses:
    '201':
      description: Заявка создана
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
            properties:
              id:
                type: integer
                format: int64
                example: 1001
              fromUserId:
                type: integer
                format: int64
                example: 10
              toUserId:
                type: integer
                format: int64
                example: 42
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: PENDING
    '204':
      description: Активная заявка уже существует
    '404':
      description: Пользователь не найден
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Пользователь не найден
              status:
                type: integer
                example: 404
              detail:
                type: string
                example: Пользователь не найден
              code:
                type: string
                example: USER_NOT_FOUND
    '409':
      description: Заявка отклонена или адресована самому себе
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              code:
                type: string
          examples:
            RequestRejected:
              summary: Пользователь уже отклонил заявку ранее
              value:
                title: Заявка была отклонена
                status: 409
                detail: Пользователь уже отклонил вашу заявку ранее
                code: FRIEND_REQUEST_REJECTED
            SelfRequest:
              summary: Попытка отправить заявку самому себе
              value:
                title: Ошибка бизнес-логики
                status: 409
                detail: Нельзя отправить заявку в друзья самому себе
                code: CANNOT_SEND_FRIEND_REQUEST_TO_SELF
