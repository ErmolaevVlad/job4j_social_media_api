post:
  summary: Отправить заявку в друзья
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: integer
              format: int64
              example: 10
            toUserId:
              type: integer
              format: int64
              example: 42
  responses:
    '201':
      description: Заявка создана
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
            properties:
              id:
                type: integer
                format: int64
                example: 1001
              fromUserId:
                type: integer
                format: int64
                example: 10
              toUserId:
                type: integer
                format: int64
                example: 42
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: PENDING
    '204':
      description: Активная заявка уже существует
    '409':
      description: Заявка была отклонена
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Заявка была отклонена
              status:
                type: integer
                example: 409
              detail:
                type: string
                example: Пользователь отклонил заявку
              code:
                type: string
                example: FRIEND_REQUEST_REJECTED
