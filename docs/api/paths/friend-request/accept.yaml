post:
  tags:
    - Offer-friendship
  operationId: acceptOfferFriendship
  summary: Принять заявку в друзья
  requestBody:
    required: true
    content:
      application/json:
        schema:
          title: acceptOfferFriendshipRequest
          type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
              format: uuid
              example: "99999999-9999-9999-9999-999999999999"
  responses:
    '200':
      description: Заявка в друзья принята
      content:
        application/json:
          schema:
            title: acceptOfferFriendshipResponse
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
            properties:
              id:
                type: string
                format: uuid
                example: "99999999-9999-9999-9999-999999999999"
              fromUserId:
                type: string
                format: uuid
                example: "11111111-1111-1111-1111-111111111111"
              toUserId:
                type: string
                format: uuid
                example: "22222222-2222-2222-2222-222222222222"
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: ACCEPTED
    '204':
      description: Заявка в друзья уже была обработана
    '400':
      description: Некорректные входные данные или не удалось прочитать JSON
      content:
        application/problem+json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ApiErrorResponse'
          examples:
            ValidationError:
              summary: Ошибка валидации полей
              value:
                title: Ошибка валидации
                status: 400
                detail: Некорректные входные данные
                code: VALIDATION_ERROR
            MalformedJson:
              summary: Некорректный JSON запроса
              value:
                title: Bad Request
                status: 400
                detail: Не удалось прочитать JSON запроса
                code: MALFORMED_JSON
    '403':
      description: Нет прав на обработку заявки
      content:
        application/problem+json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ApiErrorResponse'
          example:
            title: Недостаточно прав
            status: 403
            detail: Пользователь не имеет права обработать заявку
            code: ACCESS_DENIED
    '404':
      description: Заявка в друзья не найдена
      content:
        application/problem+json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ApiErrorResponse'
          example:
            title: Заявка в друзья не найдена
            status: 404
            detail: Заявка в друзья с указанным ID не существует
            code: FRIEND_REQUEST_NOT_FOUND
    '409':
      description: Заявка была отклонена
      content:
        application/problem+json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ApiErrorResponse'
          example:
            title: Заявка в друзья была отклонена
            status: 409
            detail: Заявка в друзья уже была отклонена
            code: FRIEND_REQUEST_REJECTED