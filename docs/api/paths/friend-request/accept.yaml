post:
  summary: Принять заявку в друзья
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - requestId
          properties:
            requestId:
              type: integer
              format: int64
              example: 1001
  responses:
    '200':
      description: Заявка в друзья принята
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - fromUserId
              - toUserId
              - status
            properties:
              id:
                type: integer
                format: int64
                example: 1001
              fromUserId:
                type: integer
                format: int64
                example: 10
              toUserId:
                type: integer
                format: int64
                example: 42
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: ACCEPTED
    '403':
      description: Нет прав на обработку заявки
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Недостаточно прав
              status:
                type: integer
                example: 403
              detail:
                type: string
                example: Пользователь не имеет права обработать заявку
              code:
                type: string
                example: ACCESS_DENIED
    '404':
      description: Заявка в друзья не найдена
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Заявка в друзья не найдена
              status:
                type: integer
                example: 404
              detail:
                type: string
                example: Заявка в друзья с указанным ID не существует
              code:
                type: string
                example: FRIEND_REQUEST_NOT_FOUND
    '204':
      description: Заявка в друзья уже была обработана