delete:
  summary: Отписаться от пользователя
  parameters:
    - name: targetUserId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 43
  responses:
    '204':
      description: Вы успешно отписались от пользователя
    '401':
      description: Пользователь не авторизован
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Пользователь не авторизован
              status:
                type: integer
                example: 401
              detail:
                type: string
                example: Пользователь не авторизован
              code:
                type: string
                example: UNAUTHORIZED
    '404':
      description: Пользователь не найден в системе
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Пользователь не найден
              status:
                type: integer
                example: 404
              detail:
                type: string
                example: Пользователь не найден в системе
              code:
                type: string
                example: USER_NOT_FOUND