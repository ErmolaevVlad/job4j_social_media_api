get:
  summary: Получить список подписок
  parameters:
    - name: page
      in: query
      required: false
      description: Номер страницы для пагинации
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    - name: limit
      in: query
      required: false
      description: Количество подписок на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  responses:
    '200':
      description: Список подписок успешно получен
      content:
        application/json:
          schema:
            type: object
            required:
              - subscriptions
              - meta
            properties:
              subscriptions:
                type: array
                description: Список подписчиков
                items:
                  type: object
                  required:
                    - id
                    - username
                    - followedAt
                  properties:
                    id:
                      type: integer
                      format: int64
                      example: 10
                    username:
                      type: string
                      example: Ivan
                    followedAt:
                      type: string
                      format: date-time
                      example: "2026-09-17T10:35:00+07:00"
              meta:
                type: object
                description: Данные для пагинации
                required:
                  - totalItems
                  - totalPages
                  - currentPage
                properties:
                  totalItems:
                    type: integer
                    format: int64
                    example: 8
                  totalPages:
                    type: integer
                    minimum: 1
                    example: 2
                  currentPage:
                    type: integer
                    minimum: 1
                    example: 1
    '401':
      description: Пользователь не авторизован
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - code
            properties:
              title:
                type: string
                example: Пользователь не авторизован
              status:
                type: integer
                example: 401
              detail:
                type: string
                example: Пользователь не авторизован
              code:
                type: string
                example: UNAUTHORIZED
