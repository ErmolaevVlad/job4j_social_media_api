                      - currentPage
                    properties:
                      totalItems:
                        type: integer
                        format: int64
                        example: 7
                      totalPages:
                        type: integer
                        minimum: 1
                        example: 2
                      currentPage:
                        type: integer
                        minimum: 1
                        example: 1
        '400':
          description: Некорректные входные данные
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Ошибка валидации
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
                    example: Некорректые входные данные
                  code:
                    type: string
                    example: BAD_REQUEST
        '401':
          description: Пользователь не авторизован
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не авторизован
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Пользователь не авторизован
                  code:
                    type: string
                    example: UNAUTHORIZED
  /api/friend-requests/reject:
    post:
      summary: Отклонить заявку в друзья
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requestId
              properties:
                requestId:
                  type: integer
                  format: int64
                  example: 1001
      responses:
        '200':
          description: Заявка в друзья отклонена
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - fromUserId
                  - toUserId
                  - status
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1234
                  fromUserId:
                    type: integer
                    format: int64
                    example: 10
                  toUserId:
                    type: integer
                    format: int64
                    example: 42
                  status:
                    type: string
                    enum:
                      - PENDING
                      - ACCEPTED
                      - REJECTED
                    example: REJECTED
        '204':
          description: Заявка уже была обработана ранее
        '403':
          description: Нет прав на обработку заявки
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Недостаточно прав
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: Пользователь не имеет права обработать заявку
                  code:
                    type: string
                    example: ACCESS_DENIED
        '404':
          description: Заявка не найдена
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Заявка не найдена
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: Заявка в друзья с указанным ID не существует
                  code:
                    type: string
                    example: FRIEND_REQUEST_NOT_FOUND
        '409':
          description: Заявка в друзья уже была принята
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Невозможно отклонить заявку
                  status:
                    type: integer
                    example: 409
                  detail:
                    type: string
                    example: Заявка в друзья уже была принята ранее
                  code:
                    type: string
                    example: FRIEND_REQUEST_ALREADY_ACCEPTED
  /api/friend-requests/send:
    post:
      summary: Отправить заявку в друзья
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromUserId
                - toUserId
              properties:
                fromUserId:
                  type: integer
                  format: int64
                  example: 10
                toUserId:
                  type: integer
                  format: int64
                  example: 42
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - fromUserId
                  - toUserId
                  - status
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1001
                  fromUserId:
                    type: integer
                    format: int64
                    example: 10
                  toUserId:
                    type: integer
                    format: int64
                    example: 42
                  status:
                    type: string
                    enum:
                      - PENDING
                      - ACCEPTED
                      - REJECTED
                    example: PENDING
        '204':
          description: Активная заявка уже существует
        '404':
          description: Пользователь не найден
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не найден
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: Пользователь не найден
                  code:
                    type: string
                    example: USER_NOT_FOUND
        '409':
          description: Заявка отклонена или адресована самому себе
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  code:
                    type: string
              examples:
                RequestRejected:
                  summary: Пользователь уже отклонил заявку ранее
                  value:
                    title: Заявка была отклонена
                    status: 409
                    detail: Пользователь уже отклонил вашу заявку ранее
                    code: FRIEND_REQUEST_REJECTED
                SelfRequest:
                  summary: Попытка отправить заявку самому себе
                  value:
                    title: Ошибка бизнес-логики
                    status: 409
                    detail: Нельзя отправить заявку в друзья самому себе
                    code: CANNOT_SEND_FRIEND_REQUEST_TO_SELF
  /api/friends/{friendId}:
    delete:
      summary: Удалить пользователя из друзей
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 53
      responses:
        '204':
          description: Пользователь успешно удален из друзей
        '400':
          description: Некорректные входные данные
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Ошибка валидации
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
                    example: Некорректые входные данные
                  code:
                    type: string
                    example: BAD_REQUEST
        '401':
          description: Пользователь не авторизован
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не авторизован
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Пользователь не авторизован
                  code:
                    type: string
                    example: UNAUTHORIZED
        '404':
          description: Пользователь не найден в списке друзей
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не найден
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: Пользователь не найден в списке ваших друзей
                  code:
                    type: string
                    example: FRIEND_NOT_FOUND
  /api/friends/friends:
    get:
      summary: Получить список друзей
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы для пагинации
          schema:
            type: integer
            minimum: 1
