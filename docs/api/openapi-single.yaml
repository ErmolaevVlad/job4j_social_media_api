openapi: 3.0.3
info:
  title: Social Media API
  version: 1.0.0
security:
  - BearerAuth: []
paths:
  /api/friend-requests/accept:
    post:
      summary: Принять заявку в друзья
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requestId
              properties:
                requestId:
                  type: integer
                  format: int64
                  example: 1001
      responses:
        '200':
          description: Заявка в друзья принята
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - fromUserId
                  - toUserId
                  - status
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1001
                  fromUserId:
                    type: integer
                    format: int64
                    example: 10
                  toUserId:
                    type: integer
                    format: int64
                    example: 42
                  status:
                    type: string
                    enum:
                      - PENDING
                      - ACCEPTED
                      - REJECTED
                    example: ACCEPTED
        '204':
          description: Заявка в друзья уже была обработана
        '400':
          description: Некорректные входные данные
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Ошибка валидации
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
                    example: Некорректные входные данные
                  code:
                    type: string
                    example: VALIDATION_ERROR
        '403':
          description: Нет прав на обработку заявки
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Недостаточно прав
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: Пользователь не имеет права обработать заявку
                  code:
                    type: string
                    example: ACCESS_DENIED
        '404':
          description: Заявка в друзья не найдена
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Заявка в друзья не найдена
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: Заявка в друзья с указанным ID не существует
                  code:
                    type: string
                    example: FRIEND_REQUEST_NOT_FOUND
        '409':
          description: Заявка была отклонена
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Заявка была отклонена
                  status:
                    type: integer
                    example: 409
                  detail:
                    type: string
                    example: Заявка в друзья уже была отклонена
                  code:
                    type: string
                    example: FRIEND_REQUEST_REJECTED
  /api/friend-requests/incoming:
    get:
      summary: Получить список входящих заявок в друзья
      parameters:
        - name: page
          in: query
          required: false
          description: Номер страницы для пагинации
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Количество заявок на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Список входящих заявок успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - requests
                  - meta
                properties:
                  requests:
                    type: array
                    description: Список входящих заявок
                    items:
                      type: object
                      required:
                        - id
                        - username
                        - createdAt
                      properties:
                        id:
                          type: integer
                          format: int64
                          example: 10
                        username:
                          type: string
                          example: Ivan
                        createdAt:
                          type: string
                          format: date-time
                          example: '2026-09-17T10:25:00+07:00'
                  meta:
                    type: object
                    description: Данные для пагинации
                    required:
                      - totalItems
                      - totalPages
                      - currentPage
                    properties:
                      totalItems:
                        type: integer
                        format: int64
                        example: 5
                      totalPages:
                        type: integer
                        minimum: 1
                        example: 2
                      currentPage:
                        type: integer
                        minimum: 1
                        example: 1
        '400':
          description: Некорректные входные данные
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Ошибка валидации
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
                    example: Некорректые входные данные
                  code:
                    type: string
                    example: BAD_REQUEST
        '401':
          description: Пользователь не авторизован
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не авторизован
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Пользователь не авторизован
                  code:
                    type: string
                    example: UNAUTHORIZED
  /api/friend-requests/outgoing:
