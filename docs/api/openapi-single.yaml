                        - username
                        - friendsSince
                      properties:
                        id:
                          type: integer
                          format: int64
                          example: 10
                        username:
                          type: string
                          example: Alex
                        friendsSince:
                          type: string
                          format: date-time
                          example: '2026-09-17T10:25:00+07:00'
                  meta:
                    type: object
                    description: Данные для пагинации
                    required:
                      - totalItems
                      - totalPages
                      - currentPage
                    properties:
                      totalItems:
                        type: integer
                        format: int64
                        example: 30
                      totalPages:
                        type: integer
                        minimum: 1
                        example: 3
                      currentPage:
                        type: integer
                        minimum: 1
                        example: 1
        '400':
          description: Некорректные входные данные
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Ошибка валидации
                  status:
