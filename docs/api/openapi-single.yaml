          example: 1
        - name: limit
          in: query
          required: false
          description: Количество элементов на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Список друзей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - friends
                  - meta
                properties:
                  friends:
                    type: array
                    description: Список друзей
                    items:
                      type: object
                      required:
