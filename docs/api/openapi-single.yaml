  /api/subscriptions/subscribe/{targetUserId}:
    put:
      summary: Подписаться на пользователя
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 42
      responses:
        '200':
          description: Подписка оформлена
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Вы успешно подписались на пользователя
        '204':
          description: Подписка уже оформлена
        '401':
          description: Пользователь не авторизован
          content:
            application/problem+json:
              schema:
                type: object
                required:
                  - title
                  - status
                  - detail
                  - code
                properties:
                  title:
                    type: string
                    example: Пользователь не авторизован
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
